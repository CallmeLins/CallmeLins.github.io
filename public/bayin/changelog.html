<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="八音更新日志 - 版本历史与功能更新">
    <title>更新日志 | 八音 BaYin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }
        .smooth-transition {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-white text-gray-900">
    <!-- Navigation -->
    <nav class="fixed top-0 w-full bg-white/80 backdrop-blur-md z-50 border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <a href="index.html" class="text-xl font-semibold smooth-transition hover:text-gray-600">八音 BaYin</a>
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="smooth-transition hover:text-gray-600">首页</a>
                    <a href="about.html" class="smooth-transition hover:text-gray-600">关于</a>
                    <a href="changelog.html" class="smooth-transition text-gray-900 font-medium">更新日志</a>
                    <a href="faq.html" class="smooth-transition hover:text-gray-600">FAQ</a>
                    <a href="contact.html" class="smooth-transition hover:text-gray-600">联系</a>
                </div>
                <a href="https://github.com/CallmeLins/BaYin" target="_blank" class="px-4 py-2 bg-gray-100 rounded-lg smooth-transition hover:bg-gray-200">GitHub</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-32 pb-20">
        <div class="max-w-4xl mx-auto px-6">
            <h1 class="text-4xl font-bold mb-8">更新日志</h1>
            <p class="text-gray-600 mb-12">
                查看八音的版本历史和功能更新。完整的 Release Notes 请访问 <a href="https://github.com/CallmeLins/BaYin/releases" target="_blank" class="text-gray-900 hover:underline">GitHub Releases</a>
            </p>

            <!-- Loading State -->
            <div id="loading" class="text-center py-12">
                <div class="animate-pulse text-gray-400">加载中...</div>
            </div>

            <!-- Timeline -->
            <div id="releases-container" class="space-y-12 hidden">
                <!-- Releases will be dynamically loaded here -->
            </div>

            <!-- Error State -->
            <div id="error" class="hidden p-6 bg-red-50 border border-red-200 rounded-xl text-red-600">
                <p class="mb-2"><strong>加载失败</strong></p>
                <p class="text-sm">无法加载 GitHub Releases，请直接访问 <a href="https://github.com/CallmeLins/BaYin/releases" target="_blank" class="underline">GitHub Releases 页面</a></p>
            </div>

            <!-- Note -->
            <div class="mt-12 p-6 bg-gray-50 rounded-xl">
                <p class="text-sm text-gray-600">
                    <strong>提示：</strong>更新日志会自动从 GitHub Releases 加载。完整的更新日志和下载链接请访问
                    <a href="https://github.com/CallmeLins/BaYin/releases" target="_blank" class="text-gray-900 hover:underline">GitHub Releases 页面</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        // Fetch and display GitHub Releases
        async function loadReleases() {
            const container = document.getElementById('releases-container');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');

            try {
                const response = await fetch('https://api.github.com/repos/CallmeLins/BaYin/releases');

                if (!response.ok) {
                    throw new Error('Failed to fetch releases');
                }

                const releases = await response.json();

                if (releases.length === 0) {
                    loading.innerHTML = '<p class="text-gray-500">暂无发布版本</p>';
                    return;
                }

                loading.classList.add('hidden');
                container.classList.remove('hidden');

                releases.forEach((release, index) => {
                    const isLatest = index === 0;
                    const date = new Date(release.published_at).toLocaleDateString('zh-CN');

                    const releaseHTML = `
                        <div class="border-l-2 border-gray-200 pl-6">
                            <div class="flex items-center gap-3 mb-3 flex-wrap">
                                ${isLatest ? '<span class="px-3 py-1 bg-gray-900 text-white text-sm rounded-full">最新</span>' : ''}
                                ${release.prerelease ? '<span class="px-3 py-1 bg-yellow-100 text-yellow-800 text-sm rounded-full">预发布</span>' : ''}
                                <h2 class="text-2xl font-semibold">${release.tag_name}</h2>
                                <span class="text-gray-500">${date}</span>
                            </div>
                            <h3 class="text-xl font-semibold mb-3">${release.name || release.tag_name}</h3>
                            <div class="prose prose-gray max-w-none text-gray-600 mb-4">
                                ${marked.parse(release.body || '暂无更新说明')}
                            </div>
                            <a href="${release.html_url}" target="_blank" class="inline-block px-4 py-2 bg-gray-100 rounded-lg text-sm hover:bg-gray-200 smooth-transition">
                                查看详情 →
                            </a>
                        </div>
                    `;

                    container.innerHTML += releaseHTML;
                });

            } catch (err) {
                console.error('Error loading releases:', err);
                loading.classList.add('hidden');
                error.classList.remove('hidden');
            }
        }

        // Simple markdown parser (lightweight alternative to marked.js)
        const marked = {
            parse: (text) => {
                if (!text) return '';
                return text
                    .replace(/### (.*?)$/gm, '<h3 class="font-semibold mt-4 mb-2">$1</h3>')
                    .replace(/## (.*?)$/gm, '<h2 class="font-semibold mt-4 mb-2 text-lg">$1</h2>')
                    .replace(/# (.*?)$/gm, '<h1 class="font-semibold mt-4 mb-2 text-xl">$1</h1>')
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" class="text-gray-900 hover:underline">$1</a>')
                    .replace(/^\* (.*?)$/gm, '<li>$1</li>')
                    .replace(/^- (.*?)$/gm, '<li>$1</li>')
                    .replace(/(<li>.*<\/li>)/s, '<ul class="list-disc ml-4 space-y-1">$1</ul>')
                    .replace(/\n\n/g, '</p><p class="mb-2">')
                    .replace(/^(?!<[hul])/gm, '<p class="mb-2">')
                    .replace(/<\/p>$/g, '');
            }
        };

        // Load releases on page load
        loadReleases();
    </script>

    <!-- Footer -->
    <footer class="py-12 bg-gray-50 border-t border-gray-200">
        <div class="max-w-6xl mx-auto px-6 text-center text-gray-600">
            <p class="mb-2">© 2026 八音 BaYin. 为音乐而设计。</p>
            <p class="text-sm">
                <a href="https://github.com/CallmeLins" target="_blank" class="hover:text-gray-900">@CallmeLins</a>
            </p>
        </div>
    </footer>
</body>
</html>
