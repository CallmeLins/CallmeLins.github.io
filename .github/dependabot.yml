version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # typescript 7 is blocked until @astrojs/check and @astrojs/svelte widen
  # their peer range (currently ^5 || ^6). Drop this rule once they do.
  ignore:
    - dependency-name: "typescript"
      versions: [">=7.0.0"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
